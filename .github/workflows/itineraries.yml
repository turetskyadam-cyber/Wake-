name: port-itineraries

# Scrapes CruiseMapper port schedule pages once a day and commits the
# result to itineraries.json. The app fetches this file from GitHub raw
# so it stays fresh without a full redeploy.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: port-itineraries
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Scrape schedules
        run: node tools/itineraries.mjs
      - name: Commit itineraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itineraries.json
          if git diff --staged --quiet; then
            echo "No itinerary changes."
          else
            git commit -m "chore: update port itineraries [skip ci]"
            git push
          fi
