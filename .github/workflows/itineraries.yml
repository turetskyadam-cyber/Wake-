name: port-itineraries

# Scrapes CruiseDig ship itinerary pages once a day, stores results in
# SQLite (cruisedig.db), and exports itineraries.json for the browser app.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: port-itineraries
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python tools/scraper.py --run-now

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itineraries.json cruisedig.db ship_slugs.json
          if git diff --staged --quiet; then
            echo "No itinerary changes to commit."
          else
            git commit -m "chore: update itineraries from CruiseDig [skip ci]"
            git pull --rebase origin main
            git push
          fi
